name: EAS Update (OTA)

# Synapse-style: merge to main → publish JS update → TestFlight/production
# builds on the matching channel pick it up on next cold start.
# Or run this by hand from GitHub Actions (including the GitHub iOS app):
# channel defaults to production, which is build.production.channel in
# lifeos-mobile/eas.json. Message is optional.
on:
  push:
    branches: [main]
    paths:
      - "lifeos-mobile/**"
      - ".github/workflows/eas-update.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS Update channel or branch. Production/TestFlight builds use production."
        required: false
        default: "production"
        type: string
      message:
        description: "Optional update message. Blank uses <git branch>@<short sha>."
        required: false
        type: string

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeos-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lifeos-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Publish update
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_CHANNEL: ${{ github.event.inputs.channel }}
          UPDATE_MESSAGE: ${{ github.event.inputs.message }}
          # Optional overrides — mobile falls back to baked public Firebase client defaults.
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.EXPO_PUBLIC_FIREBASE_DATABASE_URL }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_LIFEOS_URL: ${{ secrets.EXPO_PUBLIC_LIFEOS_URL }}
        run: |
          # Default matches eas.json build.production.channel (TestFlight/production).
          CHANNEL="${UPDATE_CHANNEL:-production}"
          if ! printf '%s' "$CHANNEL" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "Invalid channel/branch '$CHANNEL'. Use letters, numbers, and . _ / -."
            exit 1
          fi
          if [ -z "${UPDATE_MESSAGE:-}" ]; then
            UPDATE_MESSAGE="${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          fi
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub secret EXPO_TOKEN."
            echo "Create a token at https://expo.dev/accounts/mohammedsaruwars-organization/settings/access-tokens"
            echo "Then add it: GitHub repo → Settings → Secrets and variables → Actions → EXPO_TOKEN."
            exit 1
          fi
          # Prefer a UUID secret; ignore placeholders/slugs so app.json / app.config.js can win.
          if [ -n "$EAS_PROJECT_ID" ] && ! echo "$EAS_PROJECT_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "Warning: EAS_PROJECT_ID secret is not a UUID; using projectId from app config instead."
            unset EAS_PROJECT_ID
            unset EXPO_PUBLIC_EAS_PROJECT_ID
          fi
          RESOLVED="$(node -e 'const c=require("./app.config.js"); process.stdout.write(String(c.expo?.extra?.eas?.projectId||""))')"
          if ! echo "$RESOLVED" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "No valid EAS project UUID in secret or app config. Set GitHub secret EAS_PROJECT_ID to the UUID from expo.dev → Project settings."
            exit 1
          fi
          export EAS_PROJECT_ID="$RESOLVED"
          export EXPO_PUBLIC_EAS_PROJECT_ID="$RESOLVED"
          # npx eas-cli (not expo/expo-github-action): that action installs eas-cli
          # via yarn with no lockfile and has failed in this repo. Node 22 is set above.
          npx eas-cli@latest update --channel "$CHANNEL" --message "$UPDATE_MESSAGE" --non-interactive
