name: EAS Update (OTA)

# Synapse-style: merge to main → publish JS update → TestFlight/production
# builds on the matching channel pick it up on next cold start.
on:
  push:
    branches: [main]
    paths:
      - "lifeos-mobile/**"
      - ".github/workflows/eas-update.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS Update channel"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish OTA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifeos-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lifeos-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Publish update
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'production' }}"
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "Missing GitHub secret EAS_PROJECT_ID (Expo project UUID)."
            exit 1
          fi
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub secret EXPO_TOKEN."
            exit 1
          fi
          npx eas-cli@latest update --channel "$CHANNEL" --message "main@${GITHUB_SHA::7}" --non-interactive
